name: Bug report
description: Report unexpected behavior or safety gaps
labels: ["bug"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS: [e.g. Ubuntu 22.04, macOS 14, Windows 11]
        - Shell: [e.g. bash 5, PowerShell 7]
        - Codex version: [e.g. 0.1.0]
        - Template version (if known): [e.g. 0.11.0]
      value: |
        - OS:
        - Shell:
        - Codex version:
        - Template version:
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command / workflow used
      description: The exact command or workflow that triggered the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / artifacts
      description: |
        Relevant logs, error output, or run artifacts.
        **Remember to redact any secrets, tokens, or personal information.**
      placeholder: Paste logs here (redacted)
    validations:
      required: false

  - type: dropdown
    id: safety
    attributes:
      label: Safety impact
      description: Does this issue affect safety guardrails?
      options:
        - none
        - warning
        - potential dangerous execution
        - potential secret exposure
    validations:
      required: true
